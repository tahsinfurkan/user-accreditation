quarkus.datasource.jdbc.url=jdbc:tc:postgresql:18-alpine:///accreditation
quarkus.datasource.jdbc.driver=org.testcontainers.jdbc.ContainerDatabaseDriver
quarkus.scheduler.enabled=false
accreditation.circuit-breaker.request-volume-threshold=4
accreditation.circuit-breaker.delay=2s
quarkus.fault-tolerance."com.willowwealth.accreditation.adapter.in.messaging.AccreditationEventConsumer/apply".retry.delay=400
accreditation.rate-limit.admin=1000
accreditation.rate-limit.client=1000
