quarkus.application.name=user-accreditation-service
quarkus.default-locale=en-US
quarkus.http.port=9999
quarkus.http.limits.max-body-size=8M
quarkus.shutdown.timeout=30s

quarkus.rest.path=/api/v1
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.property-naming-strategy=com.fasterxml.jackson.databind.PropertyNamingStrategies$SnakeCaseStrategy

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %X %s%e%n
quarkus.log.category."com.willowwealth".level=DEBUG

quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.timezone=Europe/Malta

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/accreditation
quarkus.datasource.username=accreditation
quarkus.datasource.password=accreditation
quarkus.datasource.jdbc.foreground-validation-interval=5s

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.mapping.timezone.default-storage=normalize
quarkus.flyway.migrate-at-start=true

quarkus.redis.hosts=redis://localhost:6379
quarkus.cache.redis."user-accreditations".expire-after-write=10M

accreditation.time-zone=Europe/Malta
accreditation.messaging.send-timeout=5s
accreditation.expiry.interval=1h
accreditation.expiry.confirmed-ttl=P30D
accreditation.expiry.batch-size=500
accreditation.circuit-breaker.request-volume-threshold=10
accreditation.circuit-breaker.failure-ratio=0.5
accreditation.circuit-breaker.delay=10s
accreditation.rate-limit.admin=10
accreditation.rate-limit.client=100
accreditation.rate-limit.window=1s

kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.accreditation-events-out.connector=smallrye-kafka
mp.messaging.outgoing.accreditation-events-out.topic=accreditation-status-events
mp.messaging.outgoing.accreditation-events-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.accreditation-events-out.acks=all
mp.messaging.outgoing.accreditation-events-out.enable.idempotence=true

mp.messaging.incoming.accreditation-events-in.connector=smallrye-kafka
mp.messaging.incoming.accreditation-events-in.topic=accreditation-status-events
mp.messaging.incoming.accreditation-events-in.group.id=accreditation-projection
mp.messaging.incoming.accreditation-events-in.auto.offset.reset=earliest
mp.messaging.incoming.accreditation-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.accreditation-events-in.dead-letter-queue.topic=accreditation-status-events-dlq
mp.messaging.incoming.accreditation-events-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.accreditation-events-in.fail-on-deserialization-failure=false
