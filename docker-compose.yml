services:
  postgres:
    image: postgres:18-alpine
    # Timestamps are stored as instants; this only sets the default zone clients such as psql show them in.
    command: ["postgres", "-c", "timezone=Europe/Malta", "-c", "log_timezone=Europe/Malta"]
    environment:
      POSTGRES_DB: accreditation
      POSTGRES_USER: accreditation
      POSTGRES_PASSWORD: accreditation
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql, not .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accreditation -d accreditation"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers reach the broker as kafka:29092, an app started on the host as localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    # Both topics keep their records forever: the main one is the audit log,
    # and a dead-lettered event has to wait until someone looks at it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in accreditation-status-events accreditation-status-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=-1
        done

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:3.8.0
    ports:
      - "5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: local
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    # Longer than quarkus.shutdown.timeout, so requests still running can finish before Docker kills the process.
    stop_grace_period: 35s
    ports:
      - "9999:9999"
    environment:
      # The JVM's time zone: the log lines and the times Hibernate reads back from the database follow it.
      TZ: Europe/Malta
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/accreditation
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
